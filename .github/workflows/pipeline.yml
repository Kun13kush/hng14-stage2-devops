name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: localhost:5000

# -------------------------
# 1. LINT
# -------------------------
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Lint Python
        run: |
          pip install flake8
          flake8 api/main.py api/test_main.py worker/worker.py --max-line-length=120

      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Lint JS
        run: |
          cd frontend
          npm install
          npx eslint app.js

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

# -------------------------
# 2. TEST
# -------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          cd api
          pip install -r requirements.txt pytest pytest-cov

      - name: Run tests
        run: |
          cd api
          pytest test_main.py --cov=main --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-report
          path: api/htmlcov/

# -------------------------
# 3. BUILD
# -------------------------
  build:
    runs-on: ubuntu-latest
    needs: test

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Build images
        run: |
          docker build -t $REGISTRY/api:${{ github.sha }} -t $REGISTRY/api:latest ./api
          docker build -t $REGISTRY/worker:${{ github.sha }} -t $REGISTRY/worker:latest ./worker
          docker build -t $REGISTRY/frontend:${{ github.sha }} -t $REGISTRY/frontend:latest ./frontend

      - name: Push images
        run: |
          docker push $REGISTRY/api:${{ github.sha }}
          docker push $REGISTRY/api:latest
          docker push $REGISTRY/worker:${{ github.sha }}
          docker push $REGISTRY/worker:latest
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      # 🔴 CRITICAL: Save images as artifacts
      - name: Save images
        run: |
          docker save $REGISTRY/api:latest -o api.tar
          docker save $REGISTRY/worker:latest -o worker.tar
          docker save $REGISTRY/frontend:latest -o frontend.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            api.tar
            worker.tar
            frontend.tar

# -------------------------
# 4. SECURITY SCAN
# -------------------------
  security-scan:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i api.tar
          docker load -i worker.tar
          docker load -i frontend.tar

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan API
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL \
            --format sarif \
            --output api.sarif \
            --exit-code 1 \
            $REGISTRY/api:latest

      - name: Scan worker
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL \
            --format sarif \
            --output worker.sarif \
            --exit-code 1 \
            $REGISTRY/worker:latest

      - name: Scan frontend
        run: |
          trivy image --scanners vuln \
            --severity CRITICAL \
            --format sarif \
            --output frontend.sarif \
            --exit-code 1 \
            $REGISTRY/frontend:latest

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: "*.sarif"

      - name: Upload to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: api.sarif

# -------------------------
# 5. INTEGRATION TEST
# -------------------------
  integration-test:
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Create env
        run: |
          cat > .env << EOF
          REDIS_HOST=redis
          REDIS_PORT=6379
          QUEUE_NAME=jobs_queue
          API_URL=http://api:8000
          FRONTEND_PORT=3000
          EOF

      - name: Start stack
        run: docker compose up --build -d

      - name: Wait for frontend
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:3000; do sleep 5; done'

      - name: Integration test
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:3000/submit)
          JOB_ID=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")

          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:3000/status/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "completed" ]; then
              echo "SUCCESS"
              exit 0
            fi
            sleep 2
          done

          echo "FAILED"
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down

# -------------------------
